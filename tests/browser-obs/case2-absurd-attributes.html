<!DOCTYPE html>
<html>
<head><title>Absurd Attributes</title></head>
<body>

<!-- Case 1: Attribute without value -->
<div class>no value attr</div>

<!-- Case 2: Attribute without value then more attrs -->
<div class id="test">two attrs first no value</div>

<!-- Case 3: Unquoted attribute value -->
<div class=test>unquoted value</div>

<!-- Case 4: Single quoted attribute -->
<div class='single'>single quoted</div>

<!-- Case 5: Empty attribute value -->
<div class="">empty value</div>

<!-- Case 6: Attribute with no equals, just name -->
<div disabled>boolean attr</div>

<!-- Case 7: Multiple boolean attrs -->
<input disabled readonly type="text">

<!-- Case 8: Attribute with > in value -->
<div title="a>b">> in attr value</div>

<!-- Case 9: Attribute with unclosed quote -->
<div title="unclosed>unclosed quote</div>

<!-- Case 10: Mix of all quoting styles -->
<div class="double" id='single' data-x=unquoted>mixed quoting</div>

<!-- Case 11: Attribute with spaces around = -->
<div class = "spaces around equals"></div>

<!-- Case 12: Duplicate attributes -->
<div class="first" class="second">duplicate class</div>

<!-- Case 13: Attribute starting with dash -->
<div data--custom="test">double dash attr</div>

<!-- Case 14: Numeric attribute name -->
<div 123="test">numeric attr name</div>

</body>
</html>
