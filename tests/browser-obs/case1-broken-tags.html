<!DOCTYPE html>
<html>
<head><title>Broken Tags</title></head>
<body>
<!-- Case 1: Space before tag name -->
< div>space before tag name</div>

<!-- Case 2: Multiple spaces before tag name -->
<   div>multiple spaces</div>

<!-- Case 3: Tab before tag name -->
<	div>tab before tag name</div>

<!-- Case 4: Newline before tag name -->
<
div>newline before tag name</div>

<!-- Case 5: No closing bracket -->
<div>no closing bracket

<!-- Case 6: No closing bracket with attributes -->
<div class="test">no closing bracket with attrs

<!-- Case 7: Closing tag with space -->
</ div>space in closing tag

<!-- Case 8: Self-closing with space -->
<br />

<!-- Case 9: Self-closing no space -->
<br/>

<!-- Case 10: Unclosed tag at end -->
<div>unclosed at end
</body>
</html>
