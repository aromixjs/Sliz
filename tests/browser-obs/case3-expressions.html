<!DOCTYPE html>
<html>
<head><title>Expression Edge Cases</title></head>
<body>

<!-- Case 1: Empty expression -->
<div class={}>empty expr</div>

<!-- Case 2: Expression with only spaces -->
<div class={  }>spaces in expr</div>

<!-- Case 3: Nested braces -->
<div class={{a: 1}}>nested braces</div>

<!-- Case 4: Unclosed expression -->
<div class={unclosed>unclosed expr

<!-- Case 5: Multiple expressions in one attr -->
<div class={a}{b}>multiple exprs</div>

<!-- Case 6: Expression spanning multiple lines -->
<div class={
  long
  expression
}>multiline expr</div>

<!-- Case 7: Expression with string containing brace -->
<div class={"}"}>expr with string brace</div>

<!-- Case 8: Expression at end of file -->
<div class={last

<!-- Case 9: Just braces, no tag -->
{just braces}

<!-- Case 10: Brace inside text -->
<div>text {with} braces</div>

<!-- Case 11: Expression with comparison operators -->
<div class={a < b}>comparison</div>

<!-- Case 12: Expression with closing tag-like content -->
<div class={a</div}>expr with closing tag

<!-- Case 13: Ternary with angle brackets -->
<div class={cond ? <span/> : null}>ternary</div>

</body>
</html>
