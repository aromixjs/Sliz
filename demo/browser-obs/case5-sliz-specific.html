<!DOCTYPE html>
<html>
<head><title>Sliz-Specific Edge Cases</title></head>
<body>

<!-- Case 1: Spread attribute -->
<div {...props}>spread</div>

<!-- Case 2: Spread with leading whitespace -->
<div { ...props }>spread with spaces</div>

<!-- Case 3: Expression attribute without name -->
<div {expr}>expr only attr</div>

<!-- Case 4: Mix of normal and expression attrs -->
<div class="normal" {expr} id="test">mixed</div>

<!-- Case 5: Expression attr then normal -->
<div {expr} class="normal">expr then normal</div>

<!-- Case 6: Multiple expression attrs -->
<div {a} {b} {c}>multiple exprs</div>

<!-- Case 7: Expression attr with unclosed brace -->
<div {unclosed>unclosed expr attr

<!-- Case 8: Expression attr with value -->
<div key={value}>expr attr with value</div>

<!-- Case 9: Expression attr with spaces around name -->
<div { expr }>spaces around expr name</div>

<!-- Case 10: Nested component with expression attrs -->
<my-comp {a} class="x" id={id}>
  <child {b} />
</my-comp>

<!-- Case 11: Tag with only > and no name -->
<>text</>

<!-- Case 12: Fragment-like syntax -->
<><div>fragment</div></>

<!-- Case 13: Empty tag with whitespace -->
<div   >whitespace only tag</div>

<!-- Case 14: Tag with only newline inside -->
<div>
</div>

<!-- Case 15: Multiple tags on same line -->
<div>a</div><div>b</div><div>c</div>

<!-- Case 16: Tag name with numbers -->
<div123>numbers in tag</div123>

<!-- Case 17: Tag name starting with number -->
<123div>starts with number</123div>

<!-- Case 18: Very long tag name -->
<supercalifragilisticexpialidocious>long name</supercalifragilisticexpialidocious>

<!-- Case 19: Tag with special characters -->
<div @click="handler">@ in tag</div>
<div #ref># in tag</div>

<!-- Case 20: Template syntax in attributes -->
<div class:active={isActive}>colon in attr</div>
<div v-if={show}>vue-like</div>

</body>
</html>
