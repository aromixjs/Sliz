<!DOCTYPE html>
<html>
<head><title>Self-Closing & Nesting</title></head>
<body>

<!-- Case 1: HTML void elements with closing tag -->
<div>before</div>
<br></br>
<div>after</div>

<!-- Case 2: Custom element self-closing -->
<my-component/>
<div>after custom self-close</div>

<!-- Case 3: Script-like tag that's not actually script -->
<fake-script>var x = 1;</fake-script>
<div>after fake-script</div>

<!-- Case 4: Nested divs without closing -->
<div><div><div>nested unclosed
</div></div>

<!-- Case 5: Misnested tags -->
<b><i>bold and italic</b></i>

<!-- Case 6: Tag that looks like closing but isn't -->
<div class="</div>">attr with closing tag in value</div>

<!-- Case 7: Comment-like content -->
<div><!-- not a comment --></div>

<!-- Case 8: CDATA-like content in HTML -->
<div><![CDATA[ cdata content ]]></div>

<!-- Case 9: Processing instruction -->
<div><?xml version="1.0"?></div>

<!-- Case 10: Doctype-like inside body -->
<div><!DOCTYPE html></div>

<!-- Case 11: Multiple root elements -->
<html><head><title>multi</title></head><body>A</body></html>
<html><head><title>multi2</title></head><body>B</body></html>

<!-- Case 12: SVG-like self-closing in HTML -->
<svg><circle r="10"/></svg>

<!-- Case 13: Template-like syntax -->
<div>{{template}}</div>

<!-- Case 14: Mustache/handlebars syntax -->
<div>{{#if}}show{{/if}}</div>

<!-- Case 15: Angle bracket in text -->
<div>a < b > c</div>

</body>
</html>
